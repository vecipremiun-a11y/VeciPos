<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cocina - POSVECI</title>
<!--
  Pantalla KDS (Kitchen Display System) para TV de cocina.
  DISENADO PARA NAVEGADORES VIEJOS DE SMART TV:
    - HTML plano + CSS inline + JavaScript ES5 (var, funciones, sin arrow ni template strings)
    - XMLHttpRequest (no fetch) para maxima compatibilidad
    - Flexbox (no grid) para layout
    - Polling cada 15s, sin React, sin Pusher, sin build de Vite
  Uso:  https://TU-DOMINIO/kds.html?company_id=default
  Pantalla completa: F11 (o el modo fullscreen de la TV)
-->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: #0b1120;
    color: #e2e8f0;
    font-family: Arial, Helvetica, sans-serif;
    overflow: hidden;
  }
  /* Alto fijado por JS (window.innerHeight) — 100vh es poco confiable en
     navegadores de Smart TV (reporta menos que la pantalla real y deja la
     2da fila cortada con espacio abajo). Fallback a 100vh por si JS falla. */
  #app { display: flex; flex-direction: column; height: 100vh; }

  /* Header */
  #header {
    flex: 0 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 20px;
    background: #111a2e;
    border-bottom: 2px solid #1e293b;
  }
  #title { font-size: 26px; font-weight: bold; color: #38bdf8; }
  #title .dot { color: #22c55e; }
  #header-right { text-align: right; }
  #clock { font-size: 28px; font-weight: bold; color: #f1f5f9; line-height: 1; }

  /* Control de tamaño de tickets (propio, no depende del zoom del navegador) */
  #size-ctl { display: flex; align-items: center; gap: 8px; }
  #size-ctl button {
    width: 40px; height: 40px; border-radius: 9px;
    border: 1px solid #2a3550; background: #1a2238; color: #e2e8f0;
    font-size: 24px; font-weight: bold; cursor: pointer; line-height: 1;
    display: flex; align-items: center; justify-content: center;
  }
  #size-ctl button:active { transform: scale(0.94); }
  #size-ctl button[disabled] { opacity: 0.35; cursor: default; }
  #size-ctl .size-label {
    font-size: 14px; font-weight: bold; color: #94a3b8;
    min-width: 92px; text-align: center; text-transform: uppercase; letter-spacing: 0.5px;
  }
  #status-line { font-size: 13px; color: #64748b; margin-top: 4px; }
  #status-line .live { color: #22c55e; }
  #status-line .err { color: #ef4444; }

  /* Totales a producir (franja superior, no achica los tickets) */
  #totals {
    flex: 0 0 auto;
    padding: 8px 12px;
    background: #0e1730;
    border-bottom: 2px solid #1e293b;
  }
  .totals-label {
    font-size: 12px; font-weight: bold; color: #f59e0b;
    text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px;
    display: flex; align-items: center; gap: 6px;
  }
  .totals-chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .tchip {
    display: flex; align-items: center; gap: 9px;
    background: #1a2238; border: 1px solid #2a3550; border-radius: 10px;
    padding: 5px 14px 5px 10px;
  }
  .tchip-qty {
    font-size: 26px; font-weight: bold; color: #38bdf8; line-height: 1;
    min-width: 40px; text-align: center;
  }
  .tchip-name { font-size: 16px; color: #e2e8f0; }
  .tchip-unit { font-size: 11px; color: #64748b; margin-left: 2px; }

  /* Board */
  #board {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 12px;
    display: flex;
    flex-wrap: wrap;
    align-content: flex-start;
    gap: 12px;
  }

  /* Card — compacta para que entren más a zoom normal en la TV */
  .card {
    width: 280px;
    background: #1a2238;
    border-radius: 12px;
    border-left: 8px solid #22c55e;
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
  }
  .card.urg-green  { border-left-color: #22c55e; }
  .card.urg-yellow { border-left-color: #eab308; }
  .card.urg-orange { border-left-color: #f97316; }
  .card.urg-red    { border-left-color: #ef4444; background: #2a1620; }

  .card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; }
  .card-client { font-size: 21px; font-weight: bold; color: #ffffff; }
  .card-id { font-size: 13px; color: #64748b; }
  .card-elapsed {
    font-size: 13px; font-weight: bold; padding: 3px 9px; border-radius: 8px;
    background: rgba(255,255,255,0.08); color: #cbd5e1; white-space: nowrap;
  }
  .card-elapsed.late { background: rgba(239,68,68,0.2); color: #fca5a5; }

  .card-items { margin: 4px 0; }
  .item-row { display: flex; align-items: baseline; padding: 4px 0; border-top: 1px solid rgba(255,255,255,0.06); }
  .item-qty {
    font-size: 22px; font-weight: bold; color: #38bdf8;
    min-width: 58px; text-align: center;
    background: rgba(56,189,248,0.12); border-radius: 8px; padding: 2px 6px; margin-right: 9px;
  }
  .item-name { font-size: 17px; color: #e2e8f0; }
  .item-note { font-size: 13px; color: #fbbf24; font-style: italic; margin-top: 2px; display: block; }

  .card-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; padding-top: 6px; border-top: 1px solid rgba(255,255,255,0.1); }
  .card-due { font-size: 16px; font-weight: bold; color: #f1f5f9; }
  .card-due span { color: #64748b; font-size: 12px; font-weight: normal; }
  .badge {
    font-size: 12px; font-weight: bold; text-transform: uppercase;
    padding: 4px 8px; border-radius: 6px;
  }
  .badge.pending   { background: rgba(234,179,8,0.2);  color: #fde047; }
  .badge.confirmed { background: rgba(139,92,246,0.2); color: #c4b5fd; }
  .badge.preparing { background: rgba(56,189,248,0.2); color: #7dd3fc; }
  .badge.ready     { background: rgba(34,197,94,0.2);  color: #86efac; }

  /* Action button (transición de estado) */
  .card-action {
    margin-top: 8px;
    width: 100%;
    padding: 11px;
    border-radius: 10px;
    border: none;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    transition: opacity 0.15s, transform 0.05s;
    color: #0b1120;
  }
  .card-action:active { transform: scale(0.97); }
  .card-action[disabled] { opacity: 0.55; cursor: wait; }
  .card-action.act-pending   { background: linear-gradient(135deg, #eab308, #d97706); }
  .card-action.act-confirmed { background: linear-gradient(135deg, #06b6d4, #3b82f6); }
  .card-action.act-preparing { background: linear-gradient(135deg, #22c55e, #16a34a); }
  .card-ready {
    margin-top: 8px; padding: 11px; border-radius: 10px;
    background: rgba(34,197,94,0.12); border: 1px solid rgba(34,197,94,0.35);
    color: #86efac; font-size: 15px; font-weight: bold; text-align: center;
    text-transform: uppercase; letter-spacing: 0.5px;
  }

  /* Empty state motivador */
  #empty {
    width: 100%; padding-top: 60px;
    display: flex; flex-direction: column; align-items: center; gap: 14px;
  }
  .empty-icon { font-size: 90px; line-height: 1; animation: bob 2.6s ease-in-out infinite; }
  .empty-title {
    font-size: 56px; font-weight: bold;
    background: linear-gradient(135deg, #38bdf8, #22c55e);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
  }
  .empty-sub { font-size: 24px; color: #94a3b8; }
  .empty-hint { font-size: 18px; color: #475569; margin-top: 18px; }
  @keyframes bob { 0%,100% { transform: translateY(0);} 50% { transform: translateY(-10px);} }

  /* Tap-to-start overlay */
  #overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(11,17,32,0.97); display: flex; flex-direction: column;
    align-items: center; justify-content: center; cursor: pointer; z-index: 9999;
  }
  #overlay h2 { font-size: 44px; color: #38bdf8; margin-bottom: 16px; }
  #overlay p { font-size: 22px; color: #94a3b8; }
  #overlay .hand { font-size: 70px; margin-bottom: 20px; }
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <div id="title">&#127838; COCINA <span class="dot">&#9679;</span></div>
    <div id="size-ctl">
      <button type="button" id="size-minus" title="Más chico">&#8722;</button>
      <span class="size-label" id="size-label">Mediano</span>
      <button type="button" id="size-plus" title="Más grande">&#43;</button>
    </div>
    <div id="header-right">
      <div id="clock">--:--</div>
      <div id="status-line"><span class="live">&#9679; en vivo</span></div>
    </div>
  </div>
  <div id="totals" style="display:none"></div>
  <div id="board">
    <div id="empty">Cargando pedidos...</div>
  </div>
</div>

<div id="overlay">
  <div class="hand">&#128072;</div>
  <h2>Tocar para empezar</h2>
  <p>Activa el sonido de avisos de pedidos</p>
</div>

<script>
(function () {
  "use strict";

  // ---- Config desde la URL ----
  function getParam(name, def) {
    var m = new RegExp('[?&]' + name + '=([^&]+)').exec(window.location.search);
    return m ? decodeURIComponent(m[1]) : def;
  }
  var TOKEN = getParam('token', '');
  var COMPANY_ID = getParam('company_id', getParam('company', ''));
  var POLL_MS = 15000;

  // ---- Estado ----
  var knownIds = {};      // ids ya vistos (para detectar nuevos)
  var firstLoad = true;
  var audioCtx = null;

  // ---- Fecha local de la TV (no del servidor) ----
  function todayStr() {
    var d = new Date();
    var y = d.getFullYear();
    var m = ('0' + (d.getMonth() + 1)).slice(-2);
    var day = ('0' + d.getDate()).slice(-2);
    return y + '-' + m + '-' + day;
  }
  function pad2(n) { return (n < 10 ? '0' : '') + n; }

  // ---- Reloj ----
  function tickClock() {
    var d = new Date();
    var h = d.getHours();
    var ampm = h >= 12 ? 'PM' : 'AM';
    var h12 = h % 12; if (h12 === 0) h12 = 12;
    document.getElementById('clock').innerHTML = h12 + ':' + pad2(d.getMinutes()) + ' ' + ampm;
  }

  // ---- Sonido (Web Audio API, sin archivo) ----
  // Mismos 6 sonidos que la pantalla de Producción (src/utils/productionSounds.js),
  // portados a JS plano. El sonido elegido viene del endpoint (data.sound),
  // configurable desde Configuracion -> Sonido de Nuevos Pedidos.
  var currentSound = 'crystal-ping';

  function initAudio() {
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    } catch (e) { audioCtx = null; }
  }

  // Cadena de salida con compresor (volumen parejo sobre ruido de cocina)
  function buildOut() {
    var comp = audioCtx.createDynamicsCompressor();
    comp.threshold.value = -8; comp.knee.value = 18; comp.ratio.value = 8;
    comp.attack.value = 0.002; comp.release.value = 0.2;
    var master = audioCtx.createGain();
    master.gain.value = 1.0;
    comp.connect(master); master.connect(audioCtx.destination);
    return comp;
  }

  function tone(out, opt) {
    var now = audioCtx.currentTime;
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.type = opt.type || 'square';
    osc.frequency.value = opt.freq;
    var vol = opt.vol == null ? 0.7 : opt.vol;
    gain.gain.setValueAtTime(0.0001, now + opt.start);
    gain.gain.exponentialRampToValueAtTime(vol, now + opt.start + 0.008);
    gain.gain.setValueAtTime(vol, now + opt.start + Math.max(0, opt.dur - 0.04));
    gain.gain.exponentialRampToValueAtTime(0.0001, now + opt.start + opt.dur);
    osc.connect(gain); gain.connect(out);
    osc.start(now + opt.start); osc.stop(now + opt.start + opt.dur + 0.02);
  }
  function sweep(out, opt) {
    var now = audioCtx.currentTime;
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.type = opt.type || 'sawtooth';
    osc.frequency.setValueAtTime(opt.fromFreq, now + opt.start);
    osc.frequency.linearRampToValueAtTime(opt.toFreq, now + opt.start + opt.dur);
    var vol = opt.vol == null ? 0.7 : opt.vol;
    gain.gain.setValueAtTime(0.0001, now + opt.start);
    gain.gain.exponentialRampToValueAtTime(vol, now + opt.start + 0.012);
    gain.gain.setValueAtTime(vol, now + opt.start + Math.max(0, opt.dur - 0.05));
    gain.gain.exponentialRampToValueAtTime(0.0001, now + opt.start + opt.dur);
    osc.connect(gain); gain.connect(out);
    osc.start(now + opt.start); osc.stop(now + opt.start + opt.dur + 0.02);
  }
  // helper de nota con decay (campana/marimba/ping)
  function decayNote(out, freq, start, dur, vol, type) {
    var now = audioCtx.currentTime;
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.type = type || 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.0001, now + start);
    gain.gain.exponentialRampToValueAtTime(vol, now + start + 0.005);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + start + dur);
    osc.connect(gain); gain.connect(out);
    osc.start(now + start); osc.stop(now + start + dur + 0.02);
  }

  var SOUND_BUILDERS = {
    'crystal-ping': function (out) {
      sweep(out, { fromFreq: 2400, toFreq: 1800, start: 0, dur: 0.06, type: 'sine', vol: 0.5 });
      decayNote(out, 1975.53, 0.05, 2.5, 0.7);
      decayNote(out, 2637.02, 0.05, 2.0, 0.45);
      decayNote(out, 3951.07, 0.05, 1.5, 0.25);
      decayNote(out, 987.77, 0.05, 1.2, 0.4);
    },
    'zen-chime': function (out) {
      var f = 587.33;
      decayNote(out, f, 0, 2.8, 0.75);
      decayNote(out, f * 2, 0, 2.2, 0.45);
      decayNote(out, f * 2.76, 0, 1.8, 0.30);
      decayNote(out, f * 5.4, 0, 1.2, 0.18);
      decayNote(out, f * 1.5, 0.6, 2.4, 0.55);
      decayNote(out, f * 3, 0.6, 1.8, 0.35);
    },
    'soft-pop': function (out) {
      sweep(out, { fromFreq: 200, toFreq: 800, start: 0, dur: 0.08, type: 'sine', vol: 0.85 });
      tone(out, { freq: 783.99, start: 0.06, dur: 0.5, type: 'triangle', vol: 0.7 });
      tone(out, { freq: 1046.5, start: 0.18, dur: 1.6, type: 'triangle', vol: 0.7 });
      tone(out, { freq: 2093, start: 0.18, dur: 1.4, type: 'sine', vol: 0.45 });
      tone(out, { freq: 1568, start: 0.18, dur: 1.8, type: 'sine', vol: 0.35 });
    },
    'cinematic-arrival': function (out) {
      sweep(out, { fromFreq: 100, toFreq: 1400, start: 0, dur: 1.4, type: 'sawtooth', vol: 0.55 });
      sweep(out, { fromFreq: 200, toFreq: 2800, start: 0, dur: 1.4, type: 'sine', vol: 0.35 });
      sweep(out, { fromFreq: 800, toFreq: 80, start: 1.35, dur: 0.18, type: 'square', vol: 0.85 });
      var chord = [523.25, 659.25, 783.99, 1046.5];
      for (var i = 0; i < chord.length; i++) {
        tone(out, { freq: chord[i], start: 1.5, dur: 1.45, type: 'triangle', vol: 0.55 });
        tone(out, { freq: chord[i] * 2, start: 1.5, dur: 1.20, type: 'sine', vol: 0.30 });
      }
    },
    'double-ding': function (out) {
      decayNote(out, 1318.51, 0, 1.4, 0.75, 'triangle');
      decayNote(out, 2637.02, 0, 1.0, 0.35, 'triangle');
      decayNote(out, 1567.98, 0.35, 1.8, 0.75, 'triangle');
      decayNote(out, 3135.96, 0.35, 1.2, 0.35, 'triangle');
      decayNote(out, 2093.00, 0.8, 2.2, 0.7, 'triangle');
      decayNote(out, 4186.01, 0.8, 1.5, 0.30, 'triangle');
    },
    'warm-marimba': function (out) {
      function note(freq, start, vol) {
        if (vol == null) vol = 0.7;
        var now = audioCtx.currentTime;
        var osc = audioCtx.createOscillator(); var gain = audioCtx.createGain();
        osc.type = 'triangle'; osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.0001, now + start);
        gain.gain.exponentialRampToValueAtTime(vol, now + start + 0.005);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + start + 1.4);
        osc.connect(gain); gain.connect(out);
        osc.start(now + start); osc.stop(now + start + 1.45);
        var osc2 = audioCtx.createOscillator(); var gain2 = audioCtx.createGain();
        osc2.type = 'sine'; osc2.frequency.value = freq * 4;
        gain2.gain.setValueAtTime(0.0001, now + start);
        gain2.gain.exponentialRampToValueAtTime(vol * 0.35, now + start + 0.008);
        gain2.gain.exponentialRampToValueAtTime(0.0001, now + start + 0.5);
        osc2.connect(gain2); gain2.connect(out);
        osc2.start(now + start); osc2.stop(now + start + 0.55);
      }
      note(523.25, 0.0); note(659.25, 0.18); note(783.99, 0.36); note(1046.5, 0.54);
      note(523.25, 0.9, 0.5); note(659.25, 0.9, 0.5); note(783.99, 0.9, 0.5); note(1046.5, 0.9, 0.65);
    }
  };

  function ding() {
    if (!audioCtx) return;
    try {
      var builder = SOUND_BUILDERS[currentSound] || SOUND_BUILDERS['crystal-ping'];
      builder(buildOut());
    } catch (e) { /* ignore */ }
  }

  // ---- Urgencia segun hora de entrega ----
  function urgencyClass(order) {
    if (!order.due_time) return 'urg-green';
    var parts = String(order.due_time).split(':');
    if (parts.length < 2) return 'urg-green';
    var due = new Date();
    due.setHours(parseInt(parts[0], 10) || 0, parseInt(parts[1], 10) || 0, 0, 0);
    var diffMin = (due.getTime() - new Date().getTime()) / 60000;
    if (diffMin < 0) return 'urg-red';
    if (diffMin < 30) return 'urg-orange';
    if (diffMin < 60) return 'urg-yellow';
    return 'urg-green';
  }

  // ---- Tiempo transcurrido desde creacion ----
  function elapsedText(createdAt) {
    if (!createdAt) return '';
    var created = new Date(String(createdAt).replace(' ', 'T'));
    if (isNaN(created.getTime())) return '';
    var min = Math.floor((new Date().getTime() - created.getTime()) / 60000);
    if (min < 1) return 'recien';
    if (min < 60) return 'hace ' + min + ' min';
    var h = Math.floor(min / 60);
    return 'hace ' + h + 'h ' + (min % 60) + 'm';
  }

  function statusLabel(s) {
    if (s === 'pending') return 'Pendiente';
    if (s === 'confirmed') return 'Confirmado';
    if (s === 'preparing') return 'Preparando';
    if (s === 'ready') return 'Listo';
    return s;
  }

  function escapeHtml(str) {
    if (str === null || str === undefined) return '';
    return String(str)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // ---- Total a producir (suma por producto de todos los pedidos activos) ----
  function renderTotals(orders) {
    var el = document.getElementById('totals');
    var map = {}; // name -> { qty, unit }
    var order = []; // preserva orden de aparición
    for (var i = 0; i < orders.length; i++) {
      var items = orders[i].items || [];
      for (var j = 0; j < items.length; j++) {
        var it = items[j];
        var key = it.name;
        if (!map[key]) { map[key] = { qty: 0, unit: it.unit || 'Und' }; order.push(key); }
        map[key].qty += Number(it.qty) || 0;
      }
    }
    if (order.length === 0) { el.style.display = 'none'; el.innerHTML = ''; return; }
    // Ordenar por cantidad descendente (lo que más hay que producir, primero)
    order.sort(function (a, b) { return map[b].qty - map[a].qty; });
    var html = '<div class="totals-label">&#128230; TOTAL A PRODUCIR (' + order.length + ')</div>';
    html += '<div class="totals-chips">';
    for (var k = 0; k < order.length; k++) {
      var m = map[order[k]];
      html += '<div class="tchip">';
      html += '  <span class="tchip-qty">' + m.qty + '</span>';
      html += '  <span class="tchip-name">' + escapeHtml(order[k]) + '<span class="tchip-unit"> ' + escapeHtml(m.unit) + '</span></span>';
      html += '</div>';
    }
    html += '</div>';
    el.innerHTML = html;
    el.style.display = '';
  }

  // Botón siguiente según estado (la cocina no toca delivered/canceled)
  function nextAction(status) {
    if (status === 'pending')    return { action: 'confirm', label: '&#9989; Confirmar',          cls: 'act-pending' };
    if (status === 'confirmed')  return { action: 'start',   label: '&#128293; Iniciar Producción', cls: 'act-confirmed' };
    if (status === 'preparing')  return { action: 'ready',   label: '&#127869; Marcar Listo',     cls: 'act-preparing' };
    return null; // ready o cualquier otro → no hay botón
  }

  // ---- Render ----
  function render(orders) {
    renderTotals(orders);
    var board = document.getElementById('board');
    if (!orders || orders.length === 0) {
      board.innerHTML = ''
        + '<div id="empty">'
        + '  <div class="empty-icon">&#127869;</div>'
        + '  <div class="empty-title">¡Cocina al día!</div>'
        + '  <div class="empty-sub">No hay pedidos pendientes</div>'
        + '  <div class="empty-hint">Disfruta del momento &#9749;</div>'
        + '</div>';
      return;
    }
    var html = '';
    for (var i = 0; i < orders.length; i++) {
      var o = orders[i];
      var elapsed = elapsedText(o.created_at);
      var late = urgencyClass(o) === 'urg-red';
      html += '<div class="card ' + urgencyClass(o) + '">';
      html += '  <div class="card-top">';
      html += '    <div>';
      html += '      <div class="card-client">' + escapeHtml(o.client_name || 'Sin cliente') + '</div>';
      html += '      <div class="card-id">Orden #' + o.id + '</div>';
      html += '    </div>';
      html += '    <div class="card-elapsed ' + (late ? 'late' : '') + '">' + elapsed + '</div>';
      html += '  </div>';
      html += '  <div class="card-items">';
      var items = o.items || [];
      for (var j = 0; j < items.length; j++) {
        var it = items[j];
        var unitLabel = it.unit || 'Und';
        html += '    <div class="item-row">';
        html += '      <div class="item-qty">' + (it.qty) + '<span style="font-size:13px"> ' + escapeHtml(unitLabel) + '</span></div>';
        html += '      <div class="item-name">' + escapeHtml(it.name);
        if (it.note) html += '<span class="item-note">&#128221; ' + escapeHtml(it.note) + '</span>';
        html += '      </div>';
        html += '    </div>';
      }
      html += '  </div>';
      html += '  <div class="card-foot">';
      html += '    <div class="card-due"><span>Para</span> ' + escapeHtml(o.due_time || '--') + '</div>';
      html += '    <div class="badge ' + o.status + '">' + statusLabel(o.status) + '</div>';
      html += '  </div>';
      var act = nextAction(o.status);
      if (act) {
        html += '  <button type="button" class="card-action ' + act.cls + '" data-id="' + o.id + '" data-action="' + act.action + '">' + act.label + '</button>';
      } else if (o.status === 'ready') {
        html += '  <div class="card-ready">&#10004; Listo · esperando entrega</div>';
      }
      html += '</div>';
    }
    board.innerHTML = html;
  }

  // ---- Transición de estado (POST al endpoint) ----
  function transitionOrder(btn) {
    if (btn.disabled) return;
    var preorderId = btn.getAttribute('data-id');
    var action = btn.getAttribute('data-action');
    if (!preorderId || !action) return;
    btn.disabled = true;
    var originalHtml = btn.innerHTML;
    btn.innerHTML = '&#8987; ...';
    var xhr = new XMLHttpRequest();
    xhr.open('POST', '/api/kds/update-status', true);
    xhr.setRequestHeader('Content-Type', 'application/json');
    xhr.timeout = 10000;
    xhr.onreadystatechange = function () {
      if (xhr.readyState !== 4) return;
      if (xhr.status >= 200 && xhr.status < 300) {
        // OK — refrescar inmediato para que se vea el cambio
        fetchOrders();
      } else {
        // Restaurar botón y mostrar error simple
        btn.disabled = false;
        btn.innerHTML = originalHtml;
        var msg = 'Error';
        try { msg = JSON.parse(xhr.responseText).error || msg; } catch (e) { /* noop */ }
        alert(msg);
      }
    };
    xhr.onerror = function () { btn.disabled = false; btn.innerHTML = originalHtml; alert('Sin conexión'); };
    xhr.ontimeout = function () { btn.disabled = false; btn.innerHTML = originalHtml; alert('Tiempo agotado'); };
    try {
      xhr.send(JSON.stringify({ token: TOKEN, preorder_id: Number(preorderId), action: action }));
    } catch (e) { btn.disabled = false; btn.innerHTML = originalHtml; }
  }

  // Event delegation: un solo listener para todos los botones del board
  document.getElementById('board').addEventListener('click', function (ev) {
    var t = ev.target;
    while (t && t !== this) {
      if (t.classList && t.classList.contains('card-action')) {
        transitionOrder(t);
        return;
      }
      t = t.parentNode;
    }
  });

  // ---- Deteccion de pedidos nuevos ----
  function checkNew(orders) {
    var hasNew = false;
    var nextKnown = {};
    for (var i = 0; i < orders.length; i++) {
      var id = orders[i].id;
      nextKnown[id] = true;
      if (!knownIds[id] && !firstLoad) hasNew = true;
    }
    knownIds = nextKnown;
    if (hasNew) ding();
    firstLoad = false;
  }

  // ---- Polling (XMLHttpRequest para compatibilidad) ----
  function setStatus(ok) {
    var el = document.getElementById('status-line');
    if (ok) {
      el.innerHTML = '<span class="live">&#9679; en vivo</span>';
    } else {
      el.innerHTML = '<span class="err">&#9679; sin conexion &middot; reintentando...</span>';
    }
  }

  function fetchOrders() {
    var auth = TOKEN ? ('token=' + encodeURIComponent(TOKEN)) : ('company_id=' + encodeURIComponent(COMPANY_ID));
    var url = '/api/kds/orders?' + auth + '&day=' + todayStr() + '&_=' + new Date().getTime();
    var xhr = new XMLHttpRequest();
    xhr.open('GET', url, true);
    xhr.timeout = 12000;
    xhr.onreadystatechange = function () {
      if (xhr.readyState !== 4) return;
      if (xhr.status >= 200 && xhr.status < 300) {
        try {
          var data = JSON.parse(xhr.responseText);
          if (data.sound) currentSound = data.sound;
          var orders = data.orders || [];
          render(orders);
          checkNew(orders);
          setStatus(true);
        } catch (e) {
          setStatus(false);
        }
      } else {
        setStatus(false);
      }
    };
    xhr.onerror = function () { setStatus(false); };
    xhr.ontimeout = function () { setStatus(false); };
    try { xhr.send(); } catch (e) { setStatus(false); }
  }

  // ---- Arranque ----
  document.getElementById('overlay').onclick = function () {
    initAudio();
    // resume necesario en algunos navegadores
    if (audioCtx && audioCtx.state === 'suspended' && audioCtx.resume) audioCtx.resume();
    ding(); // confirma que suena
    document.getElementById('overlay').style.display = 'none';
  };

  // Fijar alto real de la pantalla (100vh no es confiable en TVs).
  function fitHeight() {
    var h = window.innerHeight || document.documentElement.clientHeight;
    if (h) document.getElementById('app').style.height = h + 'px';
  }
  fitHeight();
  window.addEventListener('resize', fitHeight);
  window.addEventListener('orientationchange', fitHeight);

  // ---- Selector de tamaño de tickets (propio, persistido por TV) ----
  // Escala SOLO el board (los tickets), no el header ni los totales.
  // Usa zoom (reflowea como el zoom del navegador, soportado en navegadores
  // de Smart TV WebKit/Blink) con fallback a transform scale por si acaso.
  var SIZE_LEVELS = [
    { name: 'Pequeño',    z: 0.65 },
    { name: 'Chico',      z: 0.8 },
    { name: 'Mediano',    z: 1.0 },
    { name: 'Grande',     z: 1.2 },
    { name: 'Muy grande', z: 1.4 }
  ];
  var sizeIdx = 2;
  try {
    var saved = parseInt(localStorage.getItem('kds.size'), 10);
    if (!isNaN(saved)) sizeIdx = Math.max(0, Math.min(SIZE_LEVELS.length - 1, saved));
  } catch (e) { /* noop */ }

  function applySize() {
    var lvl = SIZE_LEVELS[sizeIdx];
    var board = document.getElementById('board');
    // Preferir zoom (reflow real). Si el navegador no lo soporta, fallback.
    if (typeof board.style.zoom !== 'undefined') {
      board.style.zoom = lvl.z;
    } else {
      board.style.transform = 'scale(' + lvl.z + ')';
      board.style.transformOrigin = 'top left';
      board.style.width = (100 / lvl.z) + '%';
    }
    document.getElementById('size-label').textContent = lvl.name;
    document.getElementById('size-minus').disabled = (sizeIdx === 0);
    document.getElementById('size-plus').disabled = (sizeIdx === SIZE_LEVELS.length - 1);
    try { localStorage.setItem('kds.size', String(sizeIdx)); } catch (e) { /* noop */ }
  }
  document.getElementById('size-minus').onclick = function () {
    if (sizeIdx > 0) { sizeIdx--; applySize(); }
  };
  document.getElementById('size-plus').onclick = function () {
    if (sizeIdx < SIZE_LEVELS.length - 1) { sizeIdx++; applySize(); }
  };
  applySize();

  tickClock();
  setInterval(tickClock, 1000);
  fetchOrders();
  setInterval(fetchOrders, POLL_MS);
})();
</script>
</body>
</html>
